<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recupero Password - Aeroclub Varese</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

        :root {
            --page: #0a2a4a;         /* blu notte, sfondo pagina */
            --paper: #ffffff;
            --paper-2: #f3f6f9;
            --ink: #14202e;
            --muted: #5d6b7b;
            --line: #d3dae2;
            --primary: #0f4c81;       /* blu aeronautico */
            --primary-dark: #0a3860;
            --accent: #f0a202;        /* giallo segnale */
            --success: #1f7a52;
            --success-bg: #e6f3ec;
            --danger: #b3261e;
            --danger-bg: #fbebea;
            --warning: #f0a202;
            --text-main: #ffffff;
            --text-muted: #9fb3c8;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
            font-size: 16px;
            line-height: 1.45;
            background: var(--page);
            color: var(--ink);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* SFONDO SFOCATO */
        .background-blur {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(10, 42, 74, 0.85), rgba(10, 42, 74, 0.85)), 
                        url('https://i.ibb.co/nqvwwYNv/Senza-titolo-2.jpg'); 
            background-size: cover;
            background-position: center;
            filter: blur(10px); 
            transform: scale(1.1);
            z-index: -1;
        }

        .container { 
            background: var(--paper); 
            border-radius: 6px; 
            border: 1px solid var(--line);
            box-shadow: 0 25px 50px rgba(0,0,0,0.3); 
            width: 92%;
            max-width: 420px; 
            text-align: left; 
            padding: 28px 32px 24px;
            animation: appear 0.25s ease-out;
            position: relative;
            z-index: 1;
        }

        @keyframes appear { from { opacity: 0; } to { opacity: 1; } }

        /* LOGO */
        .logo-header {
            display: block;
            width: 160px; 
            max-width: 100%;
            height: auto;
            margin: 0 auto 14px;
        }

        h2 { 
            color: var(--ink); 
            margin: 0 0 4px; 
            font-size: 1.25rem; 
            font-weight: 600; 
            text-align: center;
        }
        
        input { 
            display: block;
            width: 100%; 
            margin: 0 0 10px; 
            padding: 11px 12px; 
            border: 1px solid #aeb9c6; 
            border-radius: 4px; 
            background: #fff; 
            color: var(--ink);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
            font-family: inherit;
        }

        input:focus { 
            border-color: var(--primary); 
            outline: 2px solid rgba(15, 76, 129, 0.25); 
            outline-offset: 0; 
        }

        button { 
            width: 100%; 
            margin-top: 6px; 
            padding: 12px; 
            background: var(--primary); 
            color: #fff; 
            border: none; 
            border-radius: 4px; 
            font-size: 1rem; 
            font-weight: 600; 
            cursor: pointer; 
            transition: background 0.2s;
            font-family: inherit;
        }

        button:hover { background: var(--primary-dark); }
        button:disabled { background: var(--paper-2); color: #9aa6b3; border: 1px solid var(--line); cursor: not-allowed; }

        .back-link { 
            display: block; 
            margin-top: 16px; 
            font-size: 0.9rem; 
            color: var(--primary) !important; 
            text-decoration: none; 
            font-weight: 500;
            text-align: center;
        }
        .back-link:hover { text-decoration: underline; }

        /* STILE MODAL */
        #custom-modal {
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(6, 20, 36, 0.8); 
            z-index: 9999; 
            justify-content: center; 
            align-items: center;
            padding: 16px;
        }
        .modal-content { 
            background: var(--paper); 
            padding: 28px; 
            border-radius: 6px; 
            width: 100%; 
            max-width: 400px; 
            text-align: left;
            border-top: 4px solid var(--success);
        }
        .modal-content h2 { text-align: left; margin-bottom: 2px; }
        .icon-check { font-size: 32px; margin-bottom: 8px; }
        .spam-alert { 
            background: #fff8e6; 
            border-left: 4px solid var(--warning); 
            padding: 12px 14px; 
            margin: 16px 0; 
            text-align: left; 
            border-radius: 4px;
            border: 1px solid #fde0bc;
            border-left-width: 4px;
        }

        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        @media (max-width: 640px) {
            .container { padding: 20px 18px; width: 96%; }
        }
    </style>
</head>
<body>

<div class="background-blur"></div>

<div id="custom-modal">
    <div class="modal-content">
        <div class="icon-check">✉️</div>
        <h2 style="color: var(--success);">Email Inviata!</h2>
        <p style="color: var(--muted); font-size: 0.85rem; margin-top: 0; margin-bottom: 12px;">Email Sent Successfully!</p>
        
        <div class="spam-alert">
            <p style="margin: 0; font-size: 0.85rem; color: #7a5500; line-height: 1.4;">
                <strong>IMPORTANTE:</strong> Controlla la cartella <strong>SPAM</strong>.<br>
                <span style="font-style: italic; font-size: 0.8rem; color: var(--muted);">Check your <strong>SPAM</strong> folder.</span>
            </p>
        </div>

        <button onclick="window.location.href='index.html'">Torna al Login</button>
    </div>
</div>

<div class="container">
    <img src="https://i.ibb.co/nqvwwYNv/Senza-titolo-2.jpg" class="logo-header" alt="Logo">
    
    <h2>Recupero Password</h2>
    <p style="font-size: 0.85rem; color: var(--muted); margin-top: 4px; margin-bottom: 16px; text-align: center;">
        Inserisci la tua email per il reset.<br>
        <i>Enter email for reset link.</i>
    </p>
    
    <input type="email" id="email-recupero" placeholder="La tua email / Your email">
    <button id="submit-btn" onclick="sendReset()">Invia Link / Send Link</button>
    
    <a href="index.html" class="back-link">← Torna al Login / Back to Login</a>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDqy6CFoufHVlqT94GdurCMzcmPFv-VprM",
        authDomain: "quiz-ppl-varese.firebaseapp.com",
        projectId: "quiz-ppl-varese",
        storageBucket: "quiz-ppl-varese.firebasestorage.app",
        messagingSenderId: "784406293571",
        appId: "1:784406293571:web:dd28c5574910502891b8f6"
    };
    firebase.initializeApp(firebaseConfig);

    async function sendReset() {
        const emailInput = document.getElementById('email-recupero');
        const email = emailInput.value.trim();
        const btn = document.getElementById('submit-btn');

        if (!email || !email.includes("@")) {
            alert("Per favore, inserisci un indirizzo email valido.");
            return;
        }

        btn.disabled = true;
        btn.innerText = "Invio in corso...";

        try {
            await firebase.auth().sendPasswordResetEmail(email);
            document.getElementById('custom-modal').style.display = 'flex';
        } catch (error) {
            btn.disabled = false;
            btn.innerText = "Invia Link / Send Link";
            if (error.code === 'auth/user-not-found') {
                alert("Email non trovata.");
            } else {
                alert("Errore: " + error.message);
            }
        }
    }
</script>

</body>
</html>
