<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricerca Database Quiz PPL - Aeroclub Varese</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDqy6CFoufHVlqT94GdurCMzcmPFv-VprM",
            authDomain: "quiz-ppl-varese.firebaseapp.com",
            projectId: "quiz-ppl-varese",
            storageBucket: "quiz-ppl-varese.firebasestorage.app",
            messagingSenderId: "784406293571",
            appId: "1:784406293571:web:dd28c5574910502891b8f6"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        const HOME_URL = "https://aviationaccount.github.io/Quiz-PPL-Aeroclub-Varese/index.html";
        let quizData = []; 

        auth.onAuthStateChanged((user) => {
            const content = document.getElementById('protected-content');
            if (user) {
                if (content) content.style.display = 'block';
                if (quizData.length === 0) loadCSV();
            } else {
                window.location.replace(HOME_URL);
            }
        });

        function goHome() {
            window.location.href = HOME_URL;
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

        :root {
            --page: #0a2a4a;         /* blu notte, sfondo pagina */
            --paper: #ffffff;
            --paper-2: #f3f6f9;
            --ink: #14202e;
            --muted: #5d6b7b;
            --line: #d3dae2;
            --primary: #0f4c81;       /* blu aeronautico */
            --primary-dark: #0a3860;
            --accent: #f0a202;        /* giallo segnale */
            --success: #1f7a52;
            --success-bg: #e6f3ec;
            --danger: #b3261e;
            --danger-bg: #fbebea;
            --warning: #f0a202;
            --text-main: #ffffff;
            --text-muted: #9fb3c8;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
            font-size: 16px;
            line-height: 1.45;
            background: var(--page);
            color: var(--ink);
            margin: 0;
            min-height: 100vh;
        }

        #protected-content { display: none; padding: 40px 0; }

        .main-container {
            max-width: 950px;
            width: 92%;
            background: var(--paper);
            border-radius: 6px;
            border: 1px solid var(--line);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            padding: 28px 32px;
            color: var(--ink);
            margin: 0 auto;
            animation: appear 0.25s ease-out;
        }

        @keyframes appear { from { opacity: 0; } to { opacity: 1; } }

        .header-box { text-align: center; margin-bottom: 24px; position: relative; }
        
        h1 { color: var(--ink); font-size: 1.5rem; margin: 10px 0 4px; font-weight: 600; }

        .search-container { 
            background-color: var(--paper-2);
            padding: 20px; 
            border-radius: 6px; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 12px; 
            border: 1px solid var(--line); 
            margin-bottom: 24px;
        }

        .search-container input { 
            padding: 11px 12px; 
            border: 1px solid #aeb9c6; 
            border-radius: 4px; 
            font-size: 1rem; 
            flex-grow: 1; 
            outline: none;
            background: #fff;
            color: var(--ink);
            font-family: inherit;
        }
        .search-container input:focus { 
            border-color: var(--primary); 
            outline: 2px solid rgba(15, 76, 129, 0.25); 
            outline-offset: 0; 
        }

        .search-container button {
            padding: 0 20px; 
            height: 43px; 
            background: var(--primary);
            color: white; 
            border: none; 
            border-radius: 4px; 
            font-weight: 600; 
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
        }
        .search-container button:hover { background: var(--primary-dark); }

        .quiz-result {
            border: 1px solid var(--line); 
            padding: 20px; 
            margin: 16px 0; 
            border-radius: 6px; 
            background: var(--paper); 
            text-align: left;
        }

        .correct-answer {
            background-color: var(--success-bg) !important; 
            color: #12482f !important;
            border: 1px solid var(--success) !important; 
            font-weight: 600; 
            padding: 10px 14px; 
            border-radius: 4px;
        }

        ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
        li { padding: 10px 14px; color: var(--ink); border: 1px solid #aeb9c6; border-radius: 4px; background: #fff; font-size: 1rem; }

        footer { text-align: center; margin-top: 40px; font-size: 0.75rem; color: var(--text-muted); padding-bottom: 40px; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 16px; }
        
        .search-icon {
            width: 48px;
            height: 48px;
            fill: var(--primary);
            margin-bottom: 6px;
        }

        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    </style>
</head>
<body>

    <div id="protected-content">
        <div class="main-container">
            <div class="header-box">
                <svg class="search-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
                <h1>Ricerca Database Quiz PPL</h1>
            </div>

            <div class="search-container">
                <input type="text" id="searchText" placeholder="Cerca parole chiave...">
                <input type="text" id="searchId" placeholder="Cerca per ID">
                <button onclick="handleSearch()">Cerca</button>
                <button onclick="resetSearch()" style="background: #fff; color: var(--primary); border: 1px solid var(--primary);">Reset</button>
            </div>

            <div id="results">
                <p style="text-align:center; color: var(--muted);">In attesa di ricerca...</p>
            </div>
        </div>

        <footer>
            © 2026 by A.D per Aeroclub di Varese. <br> Accesso riservato - IP monitorati.
        </footer>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ7nj9UrBloRfIDxZkRUkxBu1neSuPIyaR4EjBWj90BLyDK3VkOBeqZSxe2pb1jwkE7mIEelHXhzayP/pub?output=csv';

        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I'))) e.preventDefault();
            if (e.key === 'Enter') handleSearch();
        });

        async function loadCSV() {
            try {
                const response = await fetch(CSV_URL);
                const csvText = await response.text();
                quizData = parseCSV(csvText);
            } catch (e) { console.error("Errore database."); }
        }

        function parseCSV(csv) {
            const regex = /,(?=(?:(?:[^"]*"){2})*[^"]*$)/g;
            return csv.split('\n').filter(l => l.trim() !== '').map(line => {
                return line.split(regex).map(col => col.replace(/^"|"$/g, '').trim());
            }).filter(col => col.length >= 8);
        }

        function handleSearch() {
            const txt = document.getElementById('searchText').value.trim().toLowerCase();
            const id = document.getElementById('searchId').value.trim().replace('#', '').toLowerCase();
            const resDiv = document.getElementById('results');
            resDiv.innerHTML = '';
            if (!txt && !id) return;
            const filtered = quizData.filter(row => {
                const rowId = row[6] ? row[6].replace('#', '').trim().toLowerCase() : '';
                const rowTxt = row[0] ? row[0].toLowerCase() : '';
                return id ? rowId === id : rowTxt.includes(txt);
            });
            if (filtered.length > 0) { filtered.forEach(row => displayResult(row, resDiv)); }
            else { resDiv.innerHTML = '<p style="text-align:center; color: var(--muted);">Nessun risultato trovato.</p>'; }
        }

        function resetSearch() {
            document.getElementById('searchText').value = '';
            document.getElementById('searchId').value = '';
            document.getElementById('results').innerHTML = '<p style="text-align:center; color: var(--muted);">Pronto per nuova ricerca.</p>';
        }

        function displayResult(row, container) {
            const correctIdx = parseInt(row[5], 10);
            const resDiv = document.createElement('div');
            resDiv.className = 'quiz-result';
            let answersHtml = '<ul>';
            ['A', 'B', 'C', 'D'].forEach((label, i) => {
                if (row[i+1]) {
                    const isCorrect = i === correctIdx;
                    answersHtml += `<li class="${isCorrect ? 'correct-answer' : ''}">${label}. ${row[i+1]}</li>`;
                }
            });
            answersHtml += '</ul>';
            resDiv.innerHTML = `
                <div style="font-size:0.8rem; color: var(--accent); font-weight: 600; text-transform: uppercase; margin-bottom: 4px;">${row[7] || 'PPL'}</div>
                <h3 style="margin: 0 0 8px; font-size: 1.1rem; color: var(--primary);">ID #${row[6]}</h3>
                <p style="margin: 0 0 12px; font-weight: 600; color: var(--ink);">${row[0]}</p>
                ${answersHtml}
            `;
            container.appendChild(resDiv);
        }
    </script>
</body>
</html>
